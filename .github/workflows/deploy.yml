name: Deploy worker sgc-recordatorios

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: npm test

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      # Secrets del worker: se cargan solo si existen en GitHub (Settings → Secrets → Actions)
      - name: Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$EVOLUTION_API_KEY" ]; then printf '%s' "$EVOLUTION_API_KEY" | wrangler secret put EVOLUTION_API_KEY; fi
          if [ -n "$CRON_SECRET" ]; then printf '%s' "$CRON_SECRET" | wrangler secret put CRON_SECRET; fi
